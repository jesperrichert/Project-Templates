name: Build CLI
on:
  workflow_dispatch:
  push:
    paths:
      - projectler/*
    branches:
      - projectler

permissions:
  packages: write
  contents: write

jobs:
  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cd projectler && cargo install --path .
      - run: cd projectler && cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: projectler
          path: /home/runner/work/Project-Templates/Project-Templates/projectler/target/release/projectler
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: Auto Build ${{ github.run_id }}
          files: /home/runner/work/Project-Templates/Project-Templates/projectler/target/release/projectler
          generate_release_notes: true
